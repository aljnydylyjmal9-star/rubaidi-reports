
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المستخدمين</title>
<style>
body {
  font-family: Arial;
  background: #f2f4f7;
  margin: 0;
  padding: 15px;
}
.container {
  max-width: 650px;
  margin: auto;
  background: white;
  padding: 18px;
  border-radius: 12px;
}
h2 { text-align: center; color: #123b63; }
input, select, button {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 7px 0;
  border-radius: 7px;
  border: 1px solid #ccc;
  font-size: 16px;
}
button {
  background: #123b63;
  color: white;
  border: 0;
}
</style>
</head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<body>
<div class="container">
<h2>إدارة المستخدمين</h2>
<p>الربيدي للألمنيوم ولوازمه</p>

<hr>

<h3>إضافة موظف جديد</h3>

<label>اسم الموظف</label>
<input id="fullName" placeholder="اكتب اسم الموظف">

<label>اسم المستخدم</label>
<input id="username" placeholder="مثلاً: sanaa1">

<label>كلمة المرور</label>
<input id="password" type="password" placeholder="كلمة مرور الموظف">

<label>الفرع</label>
<select id="branch">
<option value="">اختر الفرع</option>
</select>

<button onclick="addEmployee()">إضافة الموظف</button>

<p id="msg"></p>
</div>
  
<script>
const SUPABASE_URL =
"https://bskmgwtegkusbjclpjfn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_UsaxPuYr2JWUscX2VA5lmg_9vcSI1oB";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// تحميل الفروع تلقائيًا
async function loadBranches() {
  const branchSelect = document.getElementById("branch");
  const msg = document.getElementById("msg");

  const { data, error } = await db
    .from("branches")
    .select("id,name")
    .order("id");

  if (error) {
    msg.textContent = "تعذر تحميل الفروع: " + error.message;
    return;
  }

  branchSelect.innerHTML =
    '<option value="">اختر الفرع</option>';

  data.forEach(branch => {
    const option = document.createElement("option");
    option.value = branch.id;
    option.textContent = branch.name;
    branchSelect.appendChild(option);
  });
}

// إضافة موظف جديد
async function addEmployee() {
  const fullName =
    document.getElementById("fullName").value.trim();

  const username =
    document.getElementById("username").value.trim().toLowerCase();

  const password =
    document.getElementById("password").value;

  const branchId =
    document.getElementById("branch").value;

  const msg = document.getElementById("msg");

  if (!fullName || !username || !password || !branchId) {
    msg.textContent = "أكمل جميع البيانات";
    return;
  }

  msg.textContent = "جارٍ إضافة الموظف...";

  const { data, error } = await db.functions.invoke(
    "manage-users",
    {
      body: {
        action: "create",
        full_name: fullName,
        username: username,
        password: password,
        branch_id: Number(branchId)
      }
    }
  );
if (error) {
  let details = error.message;

  try {
    if (error.context) {
      const body = await error.context.json();
      details = body.error || JSON.stringify(body);
    }
  } catch (e) {}

  msg.textContent = "تعذرت الإضافة: " + details;
  return;
}
  if (!data || !data.success) {
    msg.textContent =
      data?.error || "لم تتم إضافة الموظف";
    return;
  }

  msg.textContent = "تمت إضافة الموظف بنجاح";

  document.getElementById("fullName").value = "";
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("branch").value = "";
}

loadBranches();
</script>

</body>
</html>
